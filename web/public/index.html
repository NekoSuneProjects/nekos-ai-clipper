<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nekos AI Clipper — Cloud</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class", theme: { extend: {
      fontFamily: { sans: ["Inter","system-ui","sans-serif"] },
      colors: { bg:"#0b0f1a", card:"#161d2e", card2:"#1d2740", accent:"#7c5cff", accent2:"#9d6bff" }
    }}};
  </script>
  <style>
    body{font-family:Inter,system-ui,sans-serif}
    .app-bg{background:radial-gradient(1200px 500px at 10% -10%,rgba(124,92,255,.18),transparent 60%),radial-gradient(1000px 500px at 110% 10%,rgba(157,107,255,.14),transparent 55%),#0b0f1a}
    .glass{background:linear-gradient(180deg,rgba(29,39,64,.65),rgba(22,29,46,.65));backdrop-filter:blur(8px)}
    .btn-grad{background-image:linear-gradient(135deg,#7c5cff,#9d6bff)}
    .btn-grad:hover{filter:brightness(1.08)}
    ::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#2a3550;border-radius:8px}
    .bar{transition:width .3s ease}
  </style>
</head>
<body class="app-bg text-gray-200 min-h-screen">
  <header class="sticky top-0 z-30 glass border-b border-white/5">
    <div class="max-w-6xl mx-auto px-5 py-3 flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl btn-grad flex items-center justify-center text-lg">🎬</div>
      <div>
        <div class="font-extrabold text-lg leading-none">Nekos <span class="text-accent2">AI Clipper</span> <span class="text-xs text-gray-400 font-normal">Cloud</span></div>
        <div class="text-[11px] text-gray-400">Paste a VOD or upload — auto highlights &amp; montages · 1 job at a time</div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 py-6 grid lg:grid-cols-5 gap-6">
    <!-- SUBMIT -->
    <section class="lg:col-span-2 glass border border-white/5 rounded-2xl p-5 space-y-4 h-fit">
      <h2 class="text-lg font-bold">New Job</h2>

      <div>
        <label class="text-sm text-gray-400">VOD / stream URL</label>
        <input id="url" placeholder="YouTube / Twitch / Kick URL" class="w-full mt-1 bg-card2 p-2.5 rounded-lg border border-white/10 focus:border-accent outline-none" />
      </div>
      <div class="text-center text-xs text-gray-500">— or —</div>
      <div>
        <label class="text-sm text-gray-400">Upload a recording</label>
        <input id="file" type="file" accept="video/*" class="w-full mt-1 text-sm text-gray-300 file:mr-3 file:px-3 file:py-2 file:rounded-lg file:border-0 file:btn-grad file:text-white" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-sm text-gray-400">Content type</label>
          <select id="mode" class="w-full mt-1 bg-card2 p-2.5 rounded-lg border border-white/10 outline-none">
            <option value="reaction">🎙️ Reactions</option>
            <option value="gaming">🎮 Gaming (auto)</option>
            <option value="irl">📸 IRL</option>
          </select>
        </div>
        <div id="gameWrap">
          <label class="text-sm text-gray-400">Game profile</label>
          <select id="game" class="w-full mt-1 bg-card2 p-2.5 rounded-lg border border-white/10 outline-none"></select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-sm text-gray-400">Render</label>
          <select id="renderMode" class="w-full mt-1 bg-card2 p-2.5 rounded-lg border border-white/10 outline-none">
            <option value="standard">Standard clips</option>
            <option value="montage">Montage (music)</option>
          </select>
        </div>
        <div>
          <label class="text-sm text-gray-400">Format</label>
          <select id="format" class="w-full mt-1 bg-card2 p-2.5 rounded-lg border border-white/10 outline-none">
            <option value="normal">📺 Normal (16:9)</option>
            <option value="short">📱 Short (9:16)</option>
            <option value="both">🎬 Both</option>
          </select>
        </div>
      </div>

      <div id="musicWrap">
        <label class="text-sm text-gray-400">Montage music</label>
        <select id="music" class="w-full mt-1 bg-card2 p-2.5 rounded-lg border border-white/10 outline-none">
          <option value="">None</option>
        </select>
      </div>

      <button id="submit" class="w-full py-2.5 rounded-lg btn-grad font-semibold">Queue Job</button>
      <div id="submitMsg" class="text-sm text-gray-400"></div>

      <div class="pt-2 border-t border-white/5 text-center space-y-2">
        <div class="text-xs text-gray-400">💜 This service is free. Help keep the servers running:</div>
        <div class="flex justify-center gap-2 flex-wrap" id="supportLinks"></div>
      </div>
    </section>

    <!-- QUEUE -->
    <section class="lg:col-span-3 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold">Queue</h2>
        <button id="refresh" class="text-sm px-3 py-1 rounded-lg bg-card2 border border-white/10 hover:bg-white/5">↻ Refresh</button>
      </div>
      <div id="jobs" class="space-y-3"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
