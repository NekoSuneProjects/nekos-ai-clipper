name: (Windows x64) Release Build & Upload NekosAIClipper

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  push:
    branches:
      - RELEASE
      - TESTING

jobs:
  build-and-upload-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 21
          cache: npm

      - name: Install Dependencies
        run: npm install

      # ✅ Get base version from package.json
      - name: Get Base Version
        shell: pwsh
        run: |
          $base = node -p "require('./package.json').version"
          echo "BASE_VERSION=$base" >> $env:GITHUB_ENV

      # ✅ Determine BETA or RELEASE
      - name: Determine Channel + Version
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -eq "TESTING") {
            $channel = "beta"
            $tag = "BETA-${{ github.run_number }}"
            $version = "$($env:BASE_VERSION)-beta-${{ github.run_number }}"
            $name = "NekosAIClipper BETA V$($env:BASE_VERSION)-${{ github.run_number }}"
            $prerelease = "true"
          }
          else {
            $channel = "release"
            $tag = $env:BASE_VERSION
            $version = $env:BASE_VERSION
            $name = "NekosAIClipper $($env:BASE_VERSION)"
            $prerelease = "false"
          }

          echo "CHANNEL=$channel" >> $env:GITHUB_ENV
          echo "TAG=$tag" >> $env:GITHUB_ENV
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "RELEASE_NAME=$name" >> $env:GITHUB_ENV
          echo "PRERELEASE=$prerelease" >> $env:GITHUB_ENV

      - name: Build Windows App
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist folder
        run: Get-ChildItem -Recurse dist
        shell: pwsh

      # ==============================
      # Clean up any existing release/draft for this tag
      # (fixes "Validation Failed: tag_name already_exists" — release-drafter
      #  used to leave a duplicate draft on the same tag).
      # ==============================
      - name: Remove stale releases for this tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:TAG
          Write-Host "Cleaning any existing releases for tag '$tag'..."
          $ids = gh api --paginate "repos/${{ github.repository }}/releases" `
                   --jq ".[] | select(.tag_name==`"$tag`") | .id"
          foreach ($id in $ids) {
            if ($id) {
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
              Write-Host "Deleted release $id"
            }
          }

      # ==============================
      # Create Release + Upload Assets (auto-generated notes)
      # ==============================
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE != 'true' }}
          files: |
            dist/NekosAIClipper-Setup-${{ env.BASE_VERSION }}.exe
            dist/NekosAIClipper-Setup-${{ env.BASE_VERSION }}.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==============================
      # Discord Notify (notes fetched from the created release)
      # ==============================
      - name: Send Release Info to Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = gh release view "$env:TAG" --repo ${{ github.repository }} --json body --jq ".body"
          if (-not $notes) { $notes = "New build available." }
          if ($notes.Length -gt 1500) { $notes = $notes.Substring(0, 1500) + "..." }

          $exeUrl = "https://github.com/${{ github.repository }}/releases/download/$($env:TAG)/NekosAIClipper-Setup-$($env:BASE_VERSION).exe"
          $msiUrl = "https://github.com/${{ github.repository }}/releases/download/$($env:TAG)/NekosAIClipper-Setup-$($env:BASE_VERSION).msi"

          $json = @{
            username = "NekosAIClipper Bot"
            content  = "<@&1384262560395559122> **UPDATE ($($env:CHANNEL.ToUpper()))**"
            embeds = @(
              @{
                title       = "NekosAIClipper $env:VERSION"
                description = "$notes`n`n[Download EXE]($exeUrl) | [Download MSI]($msiUrl)"
                color       = if ($env:CHANNEL -eq "beta") { 16750848 } else { 16776960 }
                timestamp   = (Get-Date).ToString("o")
              }
            )
          } | ConvertTo-Json -Depth 10

          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType 'application/json' -Body $json
