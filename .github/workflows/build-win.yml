name: (Windows x64) Release Build & Upload NekosAIClipper

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  # DEV is for developing/saving only — it never builds.
  # Builds happen on TESTING (beta) and RELEASE (released).
  push:
    branches:
      - TESTING
      - RELEASE

jobs:
  build-and-upload-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history + tags so we can compute release stats
          submodules: recursive   # pull core/gameConfigs (gameconfig branch)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 21
          cache: npm

      - name: Install Dependencies
        run: npm install

      # ✅ Get base version from package.json
      - name: Get Base Version
        shell: pwsh
        run: |
          $base = node -p "require('./package.json').version"
          echo "BASE_VERSION=$base" >> $env:GITHUB_ENV

      # ✅ Determine channel: TESTING (beta) / RELEASE (release)
      - name: Determine Channel + Version
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -eq "TESTING") {
            $channel = "beta"
            $tag = "BETA-${{ github.run_number }}"
            $version = "$($env:BASE_VERSION)-beta-${{ github.run_number }}"
            $name = "NekosAIClipper BETA V$($env:BASE_VERSION)-${{ github.run_number }}"
            $prerelease = "true"
          }
          else {
            $channel = "release"
            $tag = $env:BASE_VERSION
            $version = $env:BASE_VERSION
            $name = "NekosAIClipper $($env:BASE_VERSION)"
            $prerelease = "false"
          }

          echo "CHANNEL=$channel" >> $env:GITHUB_ENV
          echo "TAG=$tag" >> $env:GITHUB_ENV
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "RELEASE_NAME=$name" >> $env:GITHUB_ENV
          echo "PRERELEASE=$prerelease" >> $env:GITHUB_ENV

      - name: Build Windows App
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist folder
        run: Get-ChildItem -Recurse dist
        shell: pwsh

      # ==============================
      # Clean up any existing release/draft for this tag
      # (fixes "Validation Failed: tag_name already_exists" — release-drafter
      #  used to leave a duplicate draft on the same tag).
      # ==============================
      - name: Remove stale releases for this tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:TAG
          Write-Host "Cleaning any existing releases for tag '$tag'..."
          $ids = gh api --paginate "repos/${{ github.repository }}/releases" `
                   --jq ".[] | select(.tag_name==`"$tag`") | .id"
          foreach ($id in $ids) {
            if ($id) {
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
              Write-Host "Deleted release $id"
            }
          }

      # ==============================
      # Create Release + Upload Assets (auto-generated notes)
      # ==============================
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE != 'true' }}
          files: |
            dist/NekosAIClipper-Setup-${{ env.BASE_VERSION }}.exe
            dist/NekosAIClipper-Setup-${{ env.BASE_VERSION }}.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==============================
      # Compute release stats (previous tag, commits, files changed)
      # ==============================
      - name: Compute release stats
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $tag  = $env:TAG
          git fetch --tags --force --quiet 2>$null | Out-Null

          # Previous release = newest release whose tag isn't the current one
          $prev = $null
          try {
            $rel = gh release list --repo $repo --limit 20 --json tagName,createdAt | ConvertFrom-Json
            $prev = ($rel | Where-Object { $_.tagName -ne $tag } | Select-Object -First 1).tagName
          } catch {}
          if (-not $prev) {
            $prev = (git tag --sort=-creatordate | Where-Object { $_ -ne $tag } | Select-Object -First 1)
          }

          $range = if ($prev) { "$prev..HEAD" } else { "HEAD" }
          $commits = (git rev-list --count $range 2>$null)
          if (-not $commits) { $commits = "1" }

          $files = "0"; $adds = "0"; $dels = "0"
          if ($prev) {
            $stat = git diff --shortstat "$prev" HEAD 2>$null
            if ($stat -match "(\d+) file")      { $files = $matches[1] }
            if ($stat -match "(\d+) insertion") { $adds  = $matches[1] }
            if ($stat -match "(\d+) deletion")  { $dels  = $matches[1] }
          }

          echo "PREV_TAG=$prev"        >> $env:GITHUB_ENV
          echo "COMMIT_COUNT=$commits" >> $env:GITHUB_ENV
          echo "FILES_CHANGED=$files"  >> $env:GITHUB_ENV
          echo "ADDS=$adds"            >> $env:GITHUB_ENV
          echo "DELS=$dels"            >> $env:GITHUB_ENV

      # ==============================
      # Discord Notify (rich embed)
      # ==============================
      - name: Send Release Info to Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo  = "${{ github.repository }}"
          $owner = "${{ github.repository_owner }}"
          $tick  = '`'   # literal backtick for inline-code

          # --- Release notes, cleaned for Discord --------------------------------
          $notes = gh release view "$env:TAG" --repo $repo --json body --jq ".body"
          if (-not $notes) { $notes = "_No release notes._" }
          # Strip GitHub auto-notes clutter so it reads like clean prose
          $notes = $notes -replace "(?im)^\s*#{1,6}\s*", ""                 # markdown headings
          $notes = $notes -replace "(?im)^\s*what's changed\s*$", ""        # boilerplate header
          $notes = $notes -replace "in https?://github\.com/[^/\s]+/[^/\s]+/pull/(\d+)", "(#`$1)"  # PR url -> (#N)
          $notes = $notes -replace "(?im)^\s*\*\*full changelog\*\*:.*$", "" # drop changelog line (we link Compare)
          $notes = $notes -replace "(?m)^\s*[\*\-]\s+", "• "                 # bullets -> •
          $notes = ($notes -split "`n" | Where-Object { $_.Trim() -ne "" }) -join "`n"
          $notes = $notes.Trim()
          if (-not $notes) { $notes = "_No release notes._" }
          if ($notes.Length -gt 3200) { $notes = $notes.Substring(0, 3200) + " …" }

          # --- Links + metadata ---------------------------------------------------
          $releaseUrl = "https://github.com/$repo/releases/tag/$($env:TAG)"
          $exeUrl     = "https://github.com/$repo/releases/download/$($env:TAG)/NekosAIClipper-Setup-$($env:BASE_VERSION).exe"
          $msiUrl     = "https://github.com/$repo/releases/download/$($env:TAG)/NekosAIClipper-Setup-$($env:BASE_VERSION).msi"
          $compareUrl = if ($env:PREV_TAG) { "https://github.com/$repo/compare/$($env:PREV_TAG)...$($env:TAG)" } else { $releaseUrl }
          $prevDisp   = if ($env:PREV_TAG) { "$tick$($env:PREV_TAG)$tick" } else { "—" }
          $isBeta     = ($env:CHANNEL -eq "beta")

          # --- Description: tidy metadata lines at the top (like the reference) ----
          $desc = @(
            "**Tag** $tick$($env:TAG)$tick"
            "**Previous** $prevDisp"
            "**Commits** $($env:COMMIT_COUNT)"
            "**Files** $($env:FILES_CHANGED) • +$($env:ADDS) / -$($env:DELS)"
            "📦 [Release]($releaseUrl) • 🔀 [Compare]($compareUrl) • 📥 [EXE]($exeUrl) • [MSI]($msiUrl)"
            ""
            "**Release notes**"
            $notes
          ) -join "`n"

          $payload = @{
            username   = "NekosAIClipper Releases"
            avatar_url = "https://github.com/$owner.png"
            content    = "<@&1384262560395559122> **NEW $($env:CHANNEL.ToUpper()) BUILD IS OUT**"
            embeds = @(
              @{
                author      = @{ name = $repo; url = "https://github.com/$repo"; icon_url = "https://github.com/$owner.png" }
                title       = $env:RELEASE_NAME
                url         = $releaseUrl
                description = $desc
                color       = if ($isBeta) { 11823359 } else { 8150271 }   # purple bar (beta brighter)
                thumbnail   = @{ url = "https://github.com/$owner.png" }
                footer      = @{ text = "$repo • $($env:CHANNEL)" }
                timestamp   = (Get-Date).ToString("o")
              }
            )
            allowed_mentions = @{ parse = @("roles") }
          } | ConvertTo-Json -Depth 12

          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType 'application/json' -Body $payload
